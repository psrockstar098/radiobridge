# Proposed CI workflow for RadioBridge.
#
# NOTE: this file is NOT committed under .github/workflows/ — the repo
# token used here lacks the `workflow` scope, so workflow files must be
# applied through the GitHub web UI (same rule as MixPilot). Copy this
# file's contents to .github/workflows/ci.yml in the web UI, then
# verify with a fresh pull that the workflow appears and runs green.
#
# What it does: builds the static library + examples and runs the
# full CTest suite on Linux, macOS, and Windows. The suite runs on
# mock backends only, so it passes on runner machines without radios.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Ubuntu only: the Linux D-Bus backend + fake-bus test need
      # libdbus headers, and the tests need a dbus-daemon + dbus-send
      # (the `dbus` package). Without these, CMake silently disables
      # the transport and the bus test is not built at all — the
      # suite would stay green while skipping the Phase 2 proof, so
      # these steps are REQUIRED, not optional. macOS/Windows jobs
      # do not need them (DBUS/JNI are gated off there by CMake).
      # JDK: GitHub's ubuntu/macos runners preinstall a JDK
      # (JAVA_HOME set), which is what the JNI bridge needs; if a
      # runner ever lacks one, add actions/setup-java@v4 (Temurin 21)
      # here — the bridge is skipped, never failed, without it.
      # OpenSSL: preinstalled on ubuntu runners; if ever absent, the
      # secure-channel tests take their NOT_SUPPORTED branch and
      # still pass.
      - name: Install Linux deps (ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev dbus

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test (CTest)
        run: ctest --test-dir build -C Release --output-on-failure
